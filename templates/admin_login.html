<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUTM Admin Login</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/cutm.png') }}">
    
    <!-- CSRF Token -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .btn-primary {
            background-color: #F57200;
            border-color: #F57200;
        }

        .btn-primary:hover {
            background-color: #e06800;
            border-color: #e06800;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(245, 114, 0, 0.3);
        }

        .cutm-theme {
            color: #0A3254;
        }
    </style>
    
    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1333197225531921');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1333197225531921&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
</head>

<body>

    <div class="card login-card p-4">
        <div class="card-body text-center">
            <img src="{{ url_for('static', filename='images/cutm.png') }}" alt="CUTM Logo" width="60" class="mb-3">
            <h4 class="fw-bold cutm-theme mb-4">Admin Dashboard Area</h4>

            <div id="errorMessage" class="alert alert-danger py-2 d-none" role="alert"></div>

            <form id="adminLoginForm">
                <div class="form-floating mb-3 text-start">
                    <input type="email" class="form-control" id="email" name="email" placeholder="Admin Email" required>
                    <label for="email">Admin Email</label>
                </div>
                <div class="form-floating mb-4 text-start">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password"
                        required>
                    <label for="password">Password</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="loginBtn">
                    <span id="btnText">Sign In</span>
                    <span class="spinner-border spinner-border-sm d-none ms-2" id="loginSpinner" role="status"
                        aria-hidden="true"></span>
                </button>
            </form>

            <a href="/" class="text-muted d-block mt-3 text-decoration-none small">Back to Website</a>
        </div>
    </div>

    <div class="position-absolute bottom-0 w-100 text-center pb-3 text-muted small">
        <p class="mb-0">&copy; 2026 CUTM Bihar Outreach. All rights reserved.</p>
        <small style="font-size: 0.75rem;">Made with ❤️ by CUTM Bihar Outreach Team</small>
    </div>

    <!-- Admin Firebase Script -->
    <script>
        // IMPORTANT: Replace this with your actual Firebase project config 
        // It must match the one from main.js!
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyCXfUfGu6hQURr8f8LOHwKgWhusTE9rGSw",
            authDomain: "bihar-outreach.firebaseapp.com",
            projectId: "bihar-outreach",
            storageBucket: "bihar-outreach.firebasestorage.app",
            messagingSenderId: "520369481431",
            appId: "1:520369481431:web:163e2573f88044a511b292",
            measurementId: "G-WYKJ551HXH"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const loginForm = document.getElementById('adminLoginForm');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const loginSpinner = document.getElementById('loginSpinner');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            // UI loading state
            loginBtn.disabled = true;
            btnText.textContent = "Authenticating...";
            loginSpinner.classList.remove('d-none');
            errorMessage.classList.add('d-none');

            // Sign In with Firebase
            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Get the ID token for the backend
                    return userCredential.user.getIdToken();
                })
                .then((idToken) => {
                    // Send Token to Flask Backend securely
                    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
                    return fetch('/admin/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrfToken
                        },
                        body: JSON.stringify({ id_token: idToken })
                    });
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = data.redirect;
                    } else {
                        throw new Error(data.message || "Failed to establish server session.");
                    }
                })
                .catch((error) => {
                    console.error("Login Error:", error);
                    errorMessage.textContent = error.message;
                    errorMessage.classList.remove('d-none');
                    loginBtn.disabled = false;
                    btnText.textContent = "Sign In";
                    loginSpinner.classList.add('d-none');
                });
        });
    </script>
</body>

</html>
